spring:
  application:
    name: nutriplan
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
    # As migrações têm acento. Sem declarar, o Flyway lê no charset da
    # plataforma, e a mesma migração passaria a significar coisas diferentes
    # conforme a máquina que a aplica.
    encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  # A porta vem do ambiente quando ele a informa.
  #
  # Plataformas de hospedagem escolhem a porta e a entregam em PORT — o Render
  # usa 10000. Ficar fixo em 8080 faz o serviço subir sem ninguem encontra-lo:
  # a aplicacao responde, o roteador bate noutra porta, e a tela fica em
  # "Application loading" ate o deploy ser dado como falho. Em desenvolvimento
  # nada muda, porque ali a variavel nao existe.
  port: ${PORT:8080}
  error:
    include-message: always

nutriplan:
  jwt:
    # Sobrescreva em producao via NUTRIPLAN_JWT_SECRET (min. 32 bytes)
    secret: ${NUTRIPLAN_JWT_SECRET:dev-secret-troque-isso-em-producao-0123456789}
    expiration-minutes: 480
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

springdoc:
  swagger-ui:
    path: /docs
