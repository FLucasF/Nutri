# Mensagens de validacao em portugues.
#
# Sem este arquivo, o texto padrao do Bean Validation chega inteiro a tela do
# usuario: "tamanho deve ser entre 0 e 20", "must not be blank". Sao mensagens
# escritas para quem programa, e aparecem embaixo do campo para quem atende.
#
# As frases aqui completam o rotulo do campo, porque e assim que a tela as
# mostra: "Telefone" + "nao pode passar de 20 caracteres". Por isso comecam em
# minuscula e nao repetem o nome do campo.
#
# Hibernate Validator 8 le este arquivo como UTF-8, entao os acentos ficam.

jakarta.validation.constraints.NotBlank.message=é obrigatório
jakarta.validation.constraints.NotNull.message=é obrigatório
jakarta.validation.constraints.NotEmpty.message=não pode ficar vazio

# min=0 e o caso comum aqui, e "entre 0 e 20" nao diz nada a quem preenche.
jakarta.validation.constraints.Size.message=não pode passar de {max} caracteres

jakarta.validation.constraints.Email.message=não parece um e-mail válido
jakarta.validation.constraints.Past.message=precisa ser uma data no passado
jakarta.validation.constraints.PastOrPresent.message=não pode ser uma data futura
jakarta.validation.constraints.Future.message=precisa ser uma data futura
jakarta.validation.constraints.FutureOrPresent.message=não pode ser uma data no passado
jakarta.validation.constraints.Min.message=não pode ser menor que {value}
jakarta.validation.constraints.Max.message=não pode ser maior que {value}
jakarta.validation.constraints.DecimalMin.message=precisa ser maior que {value}
jakarta.validation.constraints.DecimalMax.message=não pode passar de {value}
jakarta.validation.constraints.Positive.message=precisa ser maior que zero
jakarta.validation.constraints.PositiveOrZero.message=não pode ser negativo
jakarta.validation.constraints.Negative.message=precisa ser menor que zero
jakarta.validation.constraints.NegativeOrZero.message=não pode ser positivo
jakarta.validation.constraints.Digits.message=aceita até {integer} dígitos, com {fraction} casas decimais
jakarta.validation.constraints.Pattern.message=está num formato que não serve aqui
jakarta.validation.constraints.AssertTrue.message=precisa estar marcado
jakarta.validation.constraints.AssertFalse.message=precisa estar desmarcado
