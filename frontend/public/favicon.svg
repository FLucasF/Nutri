<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The macro ring (components/MacroRing.tsx) at 25/50/25, r=12, stroke 5, 2px gaps. -->
  <style>
    .t { stroke: #E8E6E0; }
    .p { stroke: #1F6F8B; }
    .c { stroke: #E09A2E; }
    .f { stroke: #7C5CBF; }
    @media (prefers-color-scheme: dark) {
      .t { stroke: #2A2D29; }
      .p { stroke: #6CC3E0; }
      .c { stroke: #F2B95A; }
      .f { stroke: #B39CE8; }
    }
  </style>
  <g fill="none" stroke-width="5" transform="rotate(-90 16 16)">
    <circle class="t" cx="16" cy="16" r="12"/>
    <circle class="p" cx="16" cy="16" r="12" stroke-linecap="round" stroke-dasharray="11.85 75.398" stroke-dashoffset="-3.5"/>
    <circle class="c" cx="16" cy="16" r="12" stroke-linecap="round" stroke-dasharray="30.699 75.398" stroke-dashoffset="-22.35"/>
    <circle class="f" cx="16" cy="16" r="12" stroke-linecap="round" stroke-dasharray="11.85 75.398" stroke-dashoffset="-60.049"/>
  </g>
</svg>
